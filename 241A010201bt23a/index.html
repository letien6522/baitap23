<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập 23a - Game Kiểm Tra Tốc Độ Phản Xạ Nâng Cao</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <h1>Game Kiểm Tra Tốc Độ Phản Xạ (BT23a)</h1>
    <div class="student-badge">
      Lớp: <strong>261INT440710</strong> | Sinh viên: <strong>Lê Minh Tiến</strong>
    </div>

    <!-- Thanh điều khiển & tùy chọn -->
    <div class="control-panel">
      <div class="form-group">
        <label for="time-select">Chọn thời gian:</label>
        <select id="time-select">
          <option value="15">15 Giây (Nhanh)</option>
          <option value="30" selected>30 Giây (Chuẩn)</option>
          <option value="45">45 Giây (Thử thách)</option>
          <option value="60">60 Giây (Dài)</option>
        </select>
      </div>

      <!-- Yêu cầu 1: Nút Đổi màu nền ngẫu nhiên -->
      <button id="btn-change-bg" class="btn btn-purple">Đổi màu nền</button>

      <!-- Yêu cầu 2: Nút Người chơi hiển thị MSSV -->
      <button id="btn-player" class="btn btn-warning">Người chơi</button>
    </div>

    <!-- Hộp hiển thị MSSV khi bấm nút Người chơi -->
    <div id="player-modal" class="player-modal">
      <div class="modal-content">
        <h3>Thông Tin Người Chơi</h3>
        <p>Họ và tên: <strong>Lê Minh Tiến</strong></p>
        <p>Mã sinh viên: <strong class="highlight-mssv" id="display-mssv">MSSV_CỦA_BẠN</strong></p>
        <p>Lớp: <strong>261INT440710</strong></p>
        <button id="btn-close-modal" class="btn btn-primary" style="margin-top: 10px;">Đóng</button>
      </div>
    </div>

    <!-- Dashboard: Điểm, Nút Bắt đầu, Đồng hồ -->
    <div class="dashboard">
      <div class="stat-box">Điểm số: <span id="score">0</span></div>
      <button id="start-btn" class="btn btn-primary">Bắt đầu chơi</button>
      <div class="stat-box">Thời gian: <span id="time">30</span>s</div>
    </div>

    <!-- Khu vực chơi #arena chuẩn 600px x 400px -->
    <div id="arena">
      <div id="target"></div>
      
      <!-- Khóa toàn bộ thao tác và hiển thị tổng kết quả khi về 0 -->
      <div id="game-over">
        <h2>HẾT GIỜ!</h2>
        <p>Tổng số điểm bạn đạt được: <span id="final-score">0</span> điểm</p>
        <p class="summary-info">Người chơi: Lê Minh Tiến - MSSV_CỦA_BẠN</p>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
